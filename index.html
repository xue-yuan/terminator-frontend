<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- An app, not a document: no zooming (double-tapping − / + used to zoom the page on iPhone). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Terminator</title>
    <meta name="description" content="Log every set. Even offline." />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terminator" />
    <script>
      // Apply the saved theme and light/dark before first paint (no flash); lib/theme.js takes over.
      var root = document.documentElement;
      var dark = matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var t = JSON.parse(localStorage.getItem('terminator:pref:theme'));
        var p = JSON.parse(localStorage.getItem('terminator:pref:palette'));
        if (t === 'light' || t === 'dark') dark = t === 'dark';
        if (typeof p === 'string' && /^[a-z]+$/.test(p)) root.dataset.palette = p;
      } catch (e) {}
      root.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f2f2f7';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
